services:
  - type: web
    name: bot-whatsapp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SESSIONS_DIR
        value: /data/sessions
      - key: ACCESS_KEY
        sync: false
    disk:
      name: sessions
      mountPath: /data
      sizeGB: 1
